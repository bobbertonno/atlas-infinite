repository: https://github.com/bobbertonno/atlas-infinite
defaultBranch: main
readmePath: README.md
prerequisites:
  - name: Node.js
    version: '>=20'
    check: node --version
  - name: pnpm
    version: '>=9'
    check: pnpm --version
  - name: Git
    version: any
    check: git --version
localSetup:
  - title: Clone the repository
    description: Download the code and enter the project folder.
    command: |
      git clone https://github.com/bobbertonno/atlas-infinite.git
      cd atlas-infinite
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Launch with one command (macOS)
    description: >-
      The launcher checks Node.js and pnpm, creates .env.local with a generated
      ATLAS_LAB_SECRET, installs dependencies, builds, starts the server and
      opens http://localhost:3000.
    command: ./scripts/launch-mac.sh
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Create the environment file manually
    description: Generate the secret that encrypts Atlas credentials in the session cookie.
    command: |
      echo "ATLAS_LAB_SECRET=$(openssl rand -base64 32)" > .env.local
      chmod 600 .env.local
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Install, build and start manually
    description: Install dependencies, build the production bundle and start it on port 3000.
    command: |
      pnpm install
      pnpm build
      pnpm start
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Run the development server
    description: Use hot reload while editing code.
    command: pnpm dev
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Deploy to Vercel (optional)
    description: >-
      Builds locally, links the Vercel project, copies ATLAS_LAB_SECRET to the
      production environment and runs vercel deploy --prod.
    command: ./scripts/launch-mac.sh --vercel
    language: bash
    provenance: repository
    sourcePath: README.md
atlasSetup:
  - title: Create an Atlas service account
    description: >-
      In Atlas, open Project Settings, Access Manager, Applications, Service
      Accounts and create credentials with the Project Owner role, which is
      needed to create and scale clusters. Copy the Client ID, Client Secret
      and Project ID.
    command: 'echo "Client ID, Client Secret and Project ID are entered in the wizard, not in env files"'
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Allow your IP in Atlas Network Access
    description: >-
      Find your public IP and add it to the project IP Access List (and to the
      Admin API access list if your organization requires one).
    command: curl -s https://checkip.amazonaws.com
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Prepare an Atlas Infinite cluster
    description: >-
      The lab provisions only the Core Gen1 replica set. Create an Atlas
      Infinite cluster in the same project where your organization supports
      it, then select Use existing cluster for Atlas Infinite in wizard step 3.
    command: 'echo "Set the Atlas Infinite source to an existing cluster in wizard step 3"'
    language: bash
    provenance: repository
    sourcePath: README.md
  - title: Connect from the wizard
    description: >-
      Choose Live Atlas Mode, enter the credentials in the Atlas Connection
      step and run Test Atlas API Connection.
    command: open http://localhost:3000
    language: bash
    provenance: repository
    sourcePath: README.md
configuration:
  - name: ATLAS_LAB_SECRET
    description: >-
      Key material for AES-256-GCM encryption of the Atlas credential session
      cookie. If unset, an ephemeral per-process key is used and credentials
      must be re-entered after every server restart.
    required: false
    secret: true
    example: <output of openssl rand -base64 32>
    modes: [atlas-connected]
demoModes: [local-demo, atlas-connected, interactive-educational]
