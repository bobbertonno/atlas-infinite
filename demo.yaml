id: atlas-infinite-experience-lab
slug: atlas-infinite-experience-lab
title: Atlas Infinite Experience Lab
tagline: A guided, side-by-side comparison of Atlas Core Gen1 and Atlas Infinite, simulated or live.
summary: >-
  An interactive Next.js lab that compares a MongoDB Atlas Core Gen1 three-node
  replica set with Atlas Infinite (two base compute nodes on shared
  disaggregated storage). An eight-step wizard configures clusters, a
  deterministic synthetic dataset, ingestion, a workload and a twelve-stage
  guided storyline. It runs fully simulated in the browser or against real
  Atlas clusters through server-side API routes.
businessProblem: >-
  Architects and decision makers need to understand how a disaggregated
  compute/storage deployment differs from a traditional replica set (data
  copies, read scaling, storage growth, backup) before choosing one. Explaining
  this with slides is abstract, and setting up a fair, repeatable comparison by
  hand takes time.
solution: >-
  The lab generates the same seeded dataset and the same logical workload for
  both deployments, visualizes each architecture, and walks a presenter
  through provisioning, loading, query compatibility, read/write paths,
  workload latency, scaling, encryption, backup and recommendations. In Live
  Atlas Mode it calls the Atlas Admin API v2 and the MongoDB Node.js driver
  from server routes; in Simulation Mode an illustrative model produces
  clearly labeled simulated metrics.
industry: Cross-industry
category: Architecture & Infrastructure
useCases:
  - Architecture comparison presentations
  - Pre-sales technical demos
  - Workload profiling with identical datasets
  - Atlas Infinite enablement
tags:
  - atlas-infinite
  - replica-set
  - architecture
  - nextjs
  - guided-demo
  - simulation
capabilities:
  - capability: atlas
    whyUsed: >-
      Server routes call the Atlas Admin API v2 with a service account to test
      the connection, check access lists, database users, limits and existing
      clusters, provision the Core Gen1 replica set and poll cluster status.
    implementationLocation: lib/server/atlas.ts
    businessValue: The demo can show real cluster lifecycle instead of only slides.
    verified: false
  - capability: crud
    whyUsed: >-
      The ingestion route bulk-loads deterministic documents with insertMany,
      and the workload route runs find, insertOne, updateOne and deleteOne
      against both clusters.
    implementationLocation: app/api/live/workload/route.ts
    businessValue: Identical logical operations run against both deployments.
    verified: false
  - capability: aggregation
    whyUsed: >-
      $collStats is used to verify collection statistics after loading, and
      $group/$sort/$limit pipelines are used for dataset fingerprints and the
      analytics part of the workload.
    implementationLocation: app/api/live/data/route.ts
    businessValue: Proves both clusters hold the same data and answer the same queries.
    verified: false
  - capability: atlas-infinite
    whyUsed: >-
      The whole storyline contrasts Atlas Infinite (Primary and Standby compute
      on shared storage, optional read-only nodes) with Core Gen1. In Live
      mode an existing Infinite cluster is attached by name; the lab does not
      provision Infinite itself.
    implementationLocation: components/lab/architecture.tsx
    businessValue: Makes the disaggregated architecture tangible for each audience level.
    verified: false
architecture:
  overview: >-
    A Next.js 16 App Router application. Demo configurations are stored in the
    browser's localStorage (lib/store.ts) and edited through an eight-step
    wizard. The guided demo (components/demo) renders twelve stages. In
    Simulation Mode all data and metrics come from a deterministic model in
    lib/simulation.ts and lib/dataset.ts. In Live Atlas Mode the browser calls
    Next.js API routes under app/api; Atlas credentials are encrypted with
    AES-256-GCM into an HttpOnly session cookie (lib/server/session.ts), and
    the routes call the Atlas Admin API v2 (lib/server/atlas.ts) and the
    MongoDB Node.js driver (lib/server/mongo.ts). Only the Core Gen1 replica
    set is provisioned by the lab; Atlas Infinite clusters are attached as
    existing clusters.
  dataFlow:
    - The presenter configures a demo in the wizard; the configuration is saved in browser localStorage.
    - In Live Atlas Mode, credentials are posted to /api/atlas/credentials and stored only in an encrypted HttpOnly cookie.
    - /api/atlas/check and /api/atlas/clusters call the Atlas Admin API v2 to validate the project and provision or read clusters.
    - /api/live/data generates seeded documents in batches and bulk-inserts the same _id values into both clusters, then verifies counts, indexes and fingerprints.
    - /api/live/workload runs the identical read/write/aggregate mix against both clusters and returns client-measured latency percentiles.
    - In Simulation Mode, the same stages are driven by lib/simulation.ts and every metric is labeled as simulated.
  diagrams:
    - id: main-flow
      title: Application, Atlas and feature flow
      description: How the wizard and guided demo reach Atlas in each mode.
      mermaid: |
        flowchart LR
          U[Presenter browser] --> W[Next.js wizard and guided demo]
          W -->|Simulation Mode| S[Deterministic simulation model]
          W -->|Live Atlas Mode| R[Next.js API routes]
          R --> C[Encrypted session cookie]
          R --> A[Atlas Admin API v2]
          R --> D[MongoDB Node.js driver]
          A --> K[(Atlas Core Gen1 replica set)]
          A --> I[(Atlas Infinite cluster)]
          D --> K
          D --> I
          D --> F[Bulk inserts, indexes, CRUD workload, aggregations]
      provenance: repository
      illustrative: false
